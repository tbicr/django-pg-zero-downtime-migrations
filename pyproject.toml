[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "django-pg-zero-downtime-migrations"
dynamic = ["version", "readme"]
description = "Django postgresql backend that apply migrations with respect to database locks"
authors = [{ name = "Paveł Tyślacki", email = "pavel.tyslacki@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["django", "postgres", "postgresql", "migrations"]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
]
dependencies = [
    "django>=4.2",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-django",
    "pytest-mock",
    "psycopg[binary]",
]

[project.urls]
Homepage = "https://github.com/tbicr/django-pg-zero-downtime-migrations"
Repository = "https://github.com/tbicr/django-pg-zero-downtime-migrations"
Changelog = "https://github.com/tbicr/django-pg-zero-downtime-migrations/blob/master/CHANGES.md"
Issues = "https://github.com/tbicr/django-pg-zero-downtime-migrations/issues"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pycodestyle errors and warnings, pyflakes, import order
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["django_zero_downtime_migrations", "tests"]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
django = ["django"]

[tool.pytest.ini_options]
addopts = "--verbose"
python_files = "tests/*/test*.py"
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.hatch.version]
path = "django_zero_downtime_migrations/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["django_zero_downtime_migrations"]

# hatchling adds every file that git does not ignore, so list the files explicitly
[tool.hatch.build.targets.sdist]
include = [
    "django_zero_downtime_migrations",
    "AUTHORS",
    "CHANGES.md",
    "README.md",
]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
text = "\n\n"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "CHANGES.md"

# pypi cannot render relative image paths, so point them to the released tag
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\(images/'
replacement = '(https://raw.githubusercontent.com/tbicr/django-pg-zero-downtime-migrations/$HFPR_VERSION/images/'
